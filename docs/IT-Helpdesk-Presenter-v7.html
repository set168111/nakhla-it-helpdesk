<style>

  --ink:#eaf6ff; --muted:#a9cbe8; --soft:#8fb6d9;
  --cyan:#5cc8ff; --mint:#5ef2c9; --coral:#ff6b81; --gold:#ffd166;
  --font:"Bahnschrift","DIN Alternate","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"Courier New",monospace;
}
:root[data-theme="light"]{
  --bg:#dfe7ef; --board:#f4f8fb; --panel:#ffffff; --panel2:#eef3f7;
  --grid1:#b7cadb; --grid2:#dbe6ef; --line:#5c7896;
  --ink:#0b2545; --muted:#3d5a80; --soft:#5c7896;
  --cyan:#1d6fd8; --mint:#1f8a7e; --coral:#d62839; --gold:#a86a12;

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
b{font-weight:600;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;flex:none;transform-origin:center center;
  background-color:var(--board);border-radius:4px;box-shadow:0 18px 48px rgba(0,0,0,.4);overflow:hidden;
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid1) 1px,transparent 1px),linear-gradient(90deg,var(--grid1) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px}
:root[data-theme="light"] #stage{background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:24px 24px}
.slide{position:absolute;inset:0;padding:84px 100px 96px;display:flex;flex-direction:column}
.kicker{font-size:18px;letter-spacing:4px;color:var(--coral);margin-bottom:12px}
h1{font-size:56px;margin:0 0 44px;font-weight:600;letter-spacing:.5px;line-height:1.12;max-width:1250px}
.lines{list-style:none;padding:0;margin:0}
.lines li{font-size:34px;line-height:1.38;margin:0 0 30px;padding-left:34px;position:relative;color:var(--muted)}
.lines li::before{content:"";position:absolute;left:2px;top:.52em;width:12px;height:12px;border:2px solid var(--cyan);transform:rotate(45deg)}
.lines li.head{padding-left:0;margin:6px 0 10px;font-size:22px;letter-spacing:3px;color:var(--soft)}
.lines li.head::before{display:none}
.lines li.sub{margin-top:14px}
.lines li.sub::before{display:none} .lines li.sub{padding-left:0}
.lines.accent-real li::before{border-color:var(--mint)}
.lines.accent-sim li::before{border-color:var(--gold);border-style:dashed}
/* stepped reveal (diagram slides only) */
.stepped li{opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,color .35s}
.stepped li.on{opacity:1;transform:none;color:var(--ink)}
.stepped li.on.past{color:var(--muted)}
.stepped li.on.past::before{border-color:var(--grid1)}
.lines:not(.stepped) li{color:var(--ink)}
.footer{position:absolute;left:100px;bottom:40px;font-size:20px;color:var(--soft);letter-spacing:.5px}
.tagline{position:absolute;right:40px;top:30px;font-size:15px;letter-spacing:2.5px;padding:6px 12px;border:2px solid;border-radius:3px;background:var(--panel)}
.tagline.illus{color:var(--coral);border-color:var(--coral)}
.tagline.evidence,.tagline.history{color:var(--gold);border-color:var(--gold)}
.tagline.live{color:var(--mint);border-color:var(--mint)}
.tagline.ref{color:var(--soft);border-color:var(--grid1)}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.files span{font-family:var(--mono);font-size:17px;color:var(--soft);border:1px solid var(--grid1);border-radius:3px;padding:3px 9px;background:var(--panel);transition:color .35s,border-color .35s,background .35s}
.files span.lit{color:var(--cyan);border-color:var(--cyan);background:rgba(92,200,255,.16)}
.lines li .subl{display:block;font-size:24px;line-height:1.35;color:var(--muted);margin-top:4px}
.lines li.has-sub{margin-bottom:22px}
.strip{font-size:19px;color:var(--soft);letter-spacing:.5px;margin-top:4px;padding:6px 12px;border:1px dashed var(--grid1);border-radius:3px;align-self:flex-start;background:var(--panel)}
.hero .heading{font-size:88px;font-weight:600;text-align:center;margin:0 0 36px;letter-spacing:.5px;line-height:1.1}
.split{display:grid;grid-template-columns:500px 1fr;gap:36px;flex:1;min-height:0;align-items:center}
.split .lines li{font-size:28px;margin-bottom:22px}
.split .lines li.head{font-size:19px;margin-bottom:8px}
.split h1{margin-bottom:24px;font-size:48px}
.slide:has(.split){padding-left:70px;padding-right:50px}
/* hero */
.hero{justify-content:center}
.hero h1{font-size:76px;margin-bottom:52px}
.hero .lines li{font-size:36px;max-width:1300px;margin-bottom:34px}
/* architecture */
svg.arch{width:100%;height:auto;display:block}
.node rect{fill:var(--panel2);stroke-width:2.5;transition:opacity .4s,fill .4s}
.node text{fill:var(--ink);font-size:18px;text-anchor:middle;font-family:var(--font);transition:opacity .4s}
.node text.s{fill:var(--soft);font-size:13.5px}
.node.k-local rect{stroke:var(--cyan)} .node.k-external rect{stroke:var(--mint)}
.node.k-supplied rect{stroke:var(--gold);stroke-dasharray:7 5} .node.k-gate rect{stroke:var(--coral);stroke-width:3.5}
.arch.focus .node{opacity:.22} .arch.focus .edge,.arch.focus .elabel{opacity:.12}
.arch.focus .node.seen{opacity:.6} .arch.focus .edge.seen{opacity:.4}
.arch.focus .node.lit{opacity:1} .arch.focus .node.lit rect{fill:rgba(92,200,255,.22)}
.edge{stroke:var(--line);stroke-width:2;fill:none;transition:opacity .4s,stroke .4s,stroke-width .4s}
.arch.focus .edge.lit{opacity:1;stroke:var(--cyan);stroke-width:3.5}
.elabel{fill:var(--soft);font-size:12px;text-anchor:middle;font-family:var(--font);paint-order:stroke;stroke:var(--board);stroke-width:6px;transition:opacity .4s}
.arch.focus .elabel.lit{opacity:1;fill:var(--cyan)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:17px;color:var(--soft);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:18px;height:12px;border:2.5px solid;margin-right:8px;vertical-align:-1px}
.legend .l1::before{border-color:var(--cyan)} .legend .l2::before{border-color:var(--mint)}
.legend .l3::before{border-color:var(--gold);border-style:dashed} .legend .l4::before{border-color:var(--coral)}
/* before / change / after */
.bca{display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;align-items:stretch;margin-bottom:40px}
.bca .box{border:2.5px solid var(--grid1);border-radius:6px;background:var(--panel);padding:22px 24px}
.bca .box h2{margin:0 0 12px;font-size:20px;letter-spacing:3px;color:var(--soft);font-weight:600}
.bca .box p{margin:0;font-size:27px;line-height:1.35}
.bca .box.after{border-color:var(--cyan)}
.bca .arr{align-self:center;height:3px;background:var(--grid1);position:relative;margin:0 8px}
.bca .arr::after{content:"";position:absolute;right:-2px;top:-7px;border-left:12px solid var(--grid1);border-top:8px solid transparent;border-bottom:8px solid transparent}
/* reference table */
table.ref{border-collapse:collapse;width:100%;background:var(--panel);border:2px solid var(--grid1)}
table.ref th,table.ref td{text-align:left;vertical-align:top;padding:18px 20px;border-bottom:1px solid var(--grid2);font-size:25px;line-height:1.35}
table.ref th{font-size:17px;letter-spacing:2.5px;color:var(--soft);font-weight:600;background:var(--panel2)}
table.ref td code{color:var(--soft)}
.slide.dense{padding:44px 56px 64px}
.slide.dense h1{font-size:40px;margin:0 0 18px}
table.ref.dense{table-layout:fixed}
table.ref.dense th,table.ref.dense td{font-size:19.5px;line-height:1.3;padding:9px 12px;overflow-wrap:anywhere}
table.ref.dense th{font-size:14px;letter-spacing:1.6px}
table.ref.dense td.mono{font-family:var(--mono);font-size:17px;color:var(--muted)}
table.ref.dense td:first-child{font-weight:600}
.example{font-size:27px;line-height:1.4;color:var(--ink);border-left:4px solid var(--gold);padding:10px 18px;background:var(--panel);margin:-12px 0 28px;max-width:1350px}
.miniflow{display:flex;align-items:center;gap:0;margin-top:14px;flex-wrap:nowrap}
.miniflow .lbl{font-size:17px;letter-spacing:2.5px;color:var(--soft);margin-right:18px}
.miniflow .st{font-family:var(--mono);font-size:21px;padding:10px 16px;border:2px dashed var(--gold);border-radius:4px;background:var(--panel);color:var(--ink)}
.miniflow .ar{width:44px;height:2px;background:var(--grid1);position:relative;flex:none}
.miniflow .ar::after{content:"";position:absolute;right:-2px;top:-6px;border-left:10px solid var(--grid1);border-top:7px solid transparent;border-bottom:7px solid transparent}
.slide.compact{padding-top:60px}
.slide.compact h1{font-size:50px;margin-bottom:30px}
.slide.compact .example{font-size:25px;padding:8px 16px;margin:-10px 0 20px}
.slide.compact .bca{margin-bottom:22px}
.slide.compact .bca .box{padding:14px 20px}
.slide.compact .bca .box h2{font-size:17px;margin-bottom:6px}
.slide.compact .bca .box p{font-size:24px}
.proofgrid{display:grid;grid-template-columns:1fr 700px;gap:30px;align-items:start}
.proofgrid .lines li{font-size:25px;line-height:1.35;margin-bottom:14px}
.refs{border:1px solid var(--grid1);border-radius:4px;background:var(--panel);padding:12px 16px}
.refs .rl{font-size:14px;letter-spacing:2.5px;color:var(--soft);margin-bottom:8px}
.refs .t{font-family:var(--mono);font-size:15.5px;line-height:1.35;color:var(--muted);margin-bottom:7px;overflow-wrap:break-word}
.refs .t span{display:block;color:var(--soft)}
.refs .f{font-family:var(--mono);font-size:15px;color:var(--soft);line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px solid var(--grid2);overflow-wrap:anywhere}
.refs .n{font-size:17px;line-height:1.4;color:var(--soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--grid2)}
.emph{margin-top:22px;font-size:25px;line-height:1.35;border-left:4px solid var(--cyan);background:var(--panel);padding:10px 16px;color:var(--ink)}
.split .lines li .subl{font-size:21px}
.evid{margin-top:20px;display:flex;flex-direction:column;gap:4px;align-self:flex-start;max-width:1400px}
.evid a{font-size:25px;color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.evid .path{font-family:var(--mono);font-size:19px;color:var(--soft);user-select:text;-webkit-user-select:text;cursor:text;overflow-wrap:anywhere;line-height:1.4}
.slide.compact h1{margin-bottom:24px}
.dnotes{margin-top:14px;border-top:1px solid var(--grid2);padding-top:10px}
.dnotes div{font-size:19px;line-height:1.4;color:var(--muted);margin-bottom:4px}
.dnotes b{color:var(--soft);font-weight:600}
.cue{font-size:21px;color:var(--soft);margin-top:26px;letter-spacing:.5px}
.cue::before{content:"▸ ";color:var(--cyan)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:6px}
.col{border:2.5px solid;border-radius:6px;padding:28px 32px;background:var(--panel)}
.col h2{margin:0 0 18px;font-size:26px;letter-spacing:3px;font-weight:600}
.col.real{border-color:var(--mint)} .col.real h2{color:var(--mint)}
.col.sim{border-color:var(--gold);border-style:dashed} .col.sim h2{color:var(--gold)}
.col ul{margin:0;padding-left:28px} .col li{font-size:31px;margin:14px 0;line-height:1.3}
table.ref td.mono{font-family:var(--mono);font-size:23px;color:var(--muted)}
.notes{margin-top:26px} .notes div{font-size:25px;line-height:1.4;color:var(--muted);margin-bottom:8px;padding-left:22px;position:relative}
.notes div::before{content:"–";position:absolute;left:0;color:var(--soft)}
.footnote{font-size:18px;color:var(--soft);margin-top:12px;line-height:1.4;max-width:1400px}
.note{font-size:26px;margin-top:30px;line-height:1.4}
.placeholder{border:2.5px dashed var(--coral);border-radius:6px;padding:40px;font-size:30px;color:var(--coral);background:var(--panel);line-height:1.4}
/* Q&A */
.answer{border-left:4px solid var(--cyan);background:var(--panel);padding:28px 34px;font-size:33px;line-height:1.45;border-radius:0 6px 6px 0;max-width:1300px}
.answer p{margin:0 0 14px} .answer p:last-child{margin:0}
/* nav */
#nav{position:fixed;right:14px;bottom:12px;display:flex;gap:8px;align-items:center;z-index:5;opacity:.55;transition:opacity .2s}
#nav:hover{opacity:1}
#nav button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--grid1);padding:6px 12px;border-radius:3px;cursor:pointer}
#nav button:disabled{opacity:.35;cursor:default}
#count{font-family:var(--mono);font-size:13px;color:var(--soft);min-width:52px;text-align:center}
#timer{position:fixed;left:14px;bottom:12px;font-family:var(--mono);font-size:14px;color:var(--soft);background:var(--panel);
  border:1px solid var(--grid1);padding:5px 10px;border-radius:3px;display:none;z-index:5}
#timer.on{display:block} #timer.warn{color:var(--gold)} #timer.over{color:var(--coral)}
</style>

        "**Policy and source rules:** `helpdesk_policy.py`, `retrieval.py`",
        "**Approval and replay protection:** `approvals.py`, `storage.py`"
      ],
      footer: "The next reference slide lists the control values and what they do." },

    { layout: "table", tag: "ref", dense: true, tableSize: 23,
      title: "Controls: values and purpose",
      columns: ["CONTROL", "VALUE", "SIMPLE DESCRIPTION"],
      colWidths: ["22%", "33%", "45%"],
      rows: [
        ["Model-call cap", "Maximum 6 attempts per turn", "Stops repeated AI calls beyond the allowed limit."],
        ["Correction-loop cap", "Maximum 1 correction cycle", "Gives Support one opportunity to correct a reviewed draft."],
        ["Input-size cap", "4,000 characters", "Rejects oversized user messages."],
        ["Output-token caps", "Selection 180; draft 1,100; correction 500; Reviewer 400", "Limits generated text per model request."],
        ["Turn spending cap", "$0.02 preflight allowance", "Blocks a model call when its estimated reservation plus turn spending would exceed the allowance."],
        ["Ledger spending cap", "Default $2.50; environment may lower it", "Blocks paid calls when spending and reservations exhaust the ledger."],
        ["Approval gate", "Valid saved draft and employee approval required", "Prevents creation without approval and rechecks."],
        ["Tool allow-list", "4 permitted read tools through the ordinary call path", "Restricts reads; separate approval code controls ticket creation."]
      ] },

    { layout: "text", tag: "ref",
      title: "What does a request cost?",
      lines: [
        "Historical 69-attempt run: confirmed partial cost $0.2285.",
        "One call with uncertain billing retains a $0.0148 reservation.",
        "Exact total and average are not claimed.",
        "$0.02 is an estimated per-turn model-call allowance, not a guaranteed billing ceiling."
      ],
      footer: "Verified against saved historical usage and current code." },

    { layout: "table", tag: "ref", dense: true, tableSize: 24,
      title: "Historical results by category",
      columns: ["CATEGORY", "PASSED / ATTEMPTS"],
      colWidths: ["60%", "40%"],
      rows: [
        ["Grounding", "9/9"],
        ["Clarification", "6/6"],
        ["Policy conflict", "15/15"],
        ["Unknown", "6/6"],
        ["Happy path", "6/6"],
        ["Rejection", "5/6"],
        ["Tool failure", "3/6"],
        ["Guardrail", "6/6"],
        ["Conflict", "6/6"],
        ["Memory", "3/3"],
        ["**Total**", "**65/69**"]
      ],
      footnote: "Source: evidence/supplemental-dock-2026-10-26/repeated.case-metrics.json",
      footer: "23 scenarios × 3 runs. Separate retests excluded." }
  ],

  /* Architecture drawing (from docs/architecture.mmd). kind: local | external | supplied | gate */
  architecture: {
    nodes: [
      { id:"UI",  label:"Employee · Gradio UI", sub:":7860", x:20,  y:40, kind:"local" },
      { id:"API", label:"FastAPI + app code", sub:":8000 · reads · finalise", x:210, y:200, kind:"local" },
      { id:"SUP", label:"Support", sub:"finds guidance, drafts", x:420, y:110, kind:"external" },
      { id:"REV", label:"Reviewer", sub:"checks sources", x:420, y:300, kind:"external" },
      { id:"R",   label:"Local search", sub:"vector index + ranking", x:630, y:40, kind:"local" },
      { id:"EMB", label:"Query embedding", sub:"OpenRouter", x:830, y:160, kind:"external" },
      { id:"P",   label:"Policy rules", sub:"in code", x:630, y:160, kind:"local" },
      { id:"KB",  label:"20 documents", sub:"company guidance", x:830, y:40, kind:"supplied" },
      { id:"S",   label:"SQLite memory", sub:"conversation + exact draft", x:20, y:420, kind:"local" },
      { id:"GATE",label:"Approval code", sub:"the only writer", x:370, y:420, kind:"gate" },
      { id:"MCP", label:"MCP server", sub:"supplied helpdesk tools", x:630, y:280, kind:"supplied" },
      { id:"SIM", label:"Simulated systems", sub:"records · status · tickets", x:830, y:280, kind:"supplied" }
    ],
    edges: [
      ["UI","API",""], ["API","UI","answer / draft / outcome"], ["API","SUP",""], ["SUP","R",""], ["R","EMB",""], ["R","KB",""], ["R","P",""], ["P","SUP",""],
      ["SUP","REV",""], ["REV","SUP","if needed, once"], ["REV","API","verdict → finalise"], ["API","S","context · exact draft"],
      ["API","MCP","app reads"], ["API","GATE","approved draft"], ["GATE","S","claim · record outcome"], ["GATE","MCP","one action ID"], ["SUP","MCP","reads only",[25,20]], ["MCP","SIM",""]
    ]
  }
};

<script id="logic">
/* ===================== presentation logic (no editing needed) ===================== */
document.addEventListener("DOMContentLoaded", function(){
const C = CONTENT, S = C.slides, $ = s=>document.querySelector(s);
const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const store = { get(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };

document.body.innerHTML = `
<div id="viewport"><div id="stage"></div></div>
<div id="timer"></div>
<div id="nav"><button id="bPrev" aria-label="Previous">◀ Previous</button><span id="count"></span><button id="bNext" aria-label="Next">Next ▶</button></div>`;
const stage=$("#stage");
function fit(){ const k=Math.min(innerWidth/1600, innerHeight/900)*0.98; stage.style.transform=`scale(${k})`; }
addEventListener("resize",fit); fit();

/* steps: only diagram slides reveal line by line; every other slide shows all text at once */
const textLines = s => (s.lines||[]).filter(l=>typeof l==="string"||l.text);
const stepCount = s => (s.layout==="arch" && !s.static) ? textLines(s).length : 1;

/* architecture */
function archSVG(){
  const A=C.architecture, NW=170, NH=68, ns="http://www.w3.org/2000/svg", N={}; A.nodes.forEach(n=>N[n.id]=n);
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 1020 500"); svg.setAttribute("class","arch focus");
  svg.innerHTML=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/></marker></defs>`;
  const ctr=n=>[n.x+NW/2,n.y+NH/2];
  const clip=(n,dx,dy)=>{ const [cx,cy]=ctr(n); const t=Math.min((NW/2+5)/Math.abs(dx||1e-9),(NH/2+5)/Math.abs(dy||1e-9)); return [cx+dx*t,cy+dy*t]; };
  const has={}; A.edges.forEach(([a,b])=>has[a+">"+b]=1);
  const E={}, G={};
  A.edges.forEach(([a,b,lab,lo])=>{   // optional lo = [dx,dy] label nudge
    lo=lo||[0,0];
    const na=N[a], nb=N[b]; const [ax,ay]=ctr(na),[bx,by]=ctr(nb); const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy);
    const off=has[b+">"+a]?(a<b?10:-10):0, ox=-dy/L*off, oy=dx/L*off;
    const p1=clip(na,dx,dy), p2=clip(nb,-dx,-dy);
    const ln=document.createElementNS(ns,"line");
    ln.setAttribute("x1",p1[0]+ox); ln.setAttribute("y1",p1[1]+oy); ln.setAttribute("x2",p2[0]+ox); ln.setAttribute("y2",p2[1]+oy);
    ln.setAttribute("class","edge"); ln.setAttribute("marker-end","url(#ah)"); svg.appendChild(ln);
    const rec={ln};
    if(lab){ const t=document.createElementNS(ns,"text"); t.setAttribute("x",(p1[0]+p2[0])/2+ox*2.6+lo[0]); t.setAttribute("y",(p1[1]+p2[1])/2+oy*2.6-6+lo[1]); t.setAttribute("class","elabel"); t.textContent=lab; svg.appendChild(t); rec.t=t; }
    E[a+">"+b]=rec;
  });
  A.nodes.forEach(n=>{ const g=document.createElementNS(ns,"g"); g.setAttribute("class","node k-"+n.kind);
    g.innerHTML=`<rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="4"/><text x="${n.x+NW/2}" y="${n.y+30}">${esc(n.label)}</text><text class="s" x="${n.x+NW/2}" y="${n.y+51}">${esc(n.sub||"")}</text>`;
    svg.appendChild(g); G[n.id]=g; });
  return {svg,E,G};
}
function highlight(arch, lines, cur){
  lines.forEach((l,i)=>{ if(i>cur||!l.highlight) return; const cls=i===cur?"lit":"seen";
    (l.highlight.nodes||[]).forEach(id=>{ const g=arch.G[id]; if(g && !g.classList.contains("lit")) g.classList.add(cls); });
    (l.highlight.edges||[]).forEach(([a,b])=>{ const e=arch.E[a+">"+b]; if(!e) return; if(!e.ln.classList.contains("lit")) e.ln.classList.add(cls); if(cls==="lit"&&e.t) e.t.classList.add("lit"); });
  });
  // a part lit now should not also be marked "seen"
  Object.values(arch.G).forEach(g=>{ if(g.classList.contains("lit")) g.classList.remove("seen"); });
  Object.values(arch.E).forEach(e=>{ if(e.ln.classList.contains("lit")) e.ln.classList.remove("seen"); });
}

/* render */
let si=0, step=0;
function filesRow(list){ const f=el("div","files"); list.forEach(x=>f.appendChild(el("span","",esc(x)))); return f; }
function bulletList(items, cls){ const ul=el("ul","lines"+(cls?" "+cls:"")); items.forEach(t=>{
    if (typeof t==="string"){ ul.appendChild(el("li","",fmt(t))); return; }
    const li=el("li",t.sub?"has-sub":"",fmt(t.text)); (t.sub||[]).forEach(x=>li.appendChild(el("span","subl",fmt(x)))); ul.appendChild(li); }); return ul; }
function render(){
  const s=S[si]; step=Math.max(0,Math.min(step,stepCount(s)-1));
  stage.innerHTML=""; const sl=el("div","slide"+(s.layout==="hero"?" hero":"")+(s.dense?" dense":"")+(s.compact?" compact":"")); stage.appendChild(sl);
  if (s.tag && C.tags[s.tag]) sl.appendChild(el("div","tagline "+s.tag,esc(C.tags[s.tag])));
  if (s.layout==="qa") sl.appendChild(el("div","kicker","QUESTION"));

  if (s.layout==="arch"){
    const sp=el("div","split"), left=el("div"), right=el("div");
    left.appendChild(el("h1","",fmt(s.title)));
    const ul=el("ul","lines stepped"); const tl=textLines(s); let k=-1;
    s.lines.forEach(l=>{
      if (l.head){ const nextIdx=k+1; const li=el("li","head",fmt(l.head)); li.classList.add("on-if"); li.dataset.idx=nextIdx; ul.appendChild(li); return; }
      k++; const li=el("li","",fmt(l.text)); if(l.sub) li.appendChild(el("span","subl",fmt(l.sub))); if(s.static||k<=step) li.classList.add("on"); if(!s.static&&k<step) li.classList.add("past"); ul.appendChild(li);
    });
    ul.querySelectorAll("li.head").forEach(h=>{ if(+h.dataset.idx<=step) h.classList.add("on"); });
    left.appendChild(ul);
    if (s.files){ const fr=filesRow(s.files); const cur=tl[step]; const on=(cur&&cur.highlight&&cur.highlight.files)||[];
      fr.querySelectorAll("span").forEach(sp=>{ if(on.includes(sp.textContent)) sp.classList.add("lit"); }); left.appendChild(fr); }
    if (s.emphasis) left.appendChild(el("div","emph",fmt(s.emphasis)));
    const arch=archSVG(); if (s.static) arch.svg.classList.remove("focus"); right.appendChild(arch.svg);
    right.appendChild(el("div","legend",`<span class="l1">real, local code</span><span class="l2">real external AI</span><span class="l3">supplied / simulated</span><span class="l4">approval gate</span>`));
    if (s.diagramNotes){ const dn=el("div","dnotes"); s.diagramNotes.forEach(x=>dn.appendChild(el("div","",fmt(x)))); right.appendChild(dn); }
    sp.append(left,right); sl.appendChild(sp);
    if (!s.static) highlight(arch, tl, step);
  } else {
    if (s.heading) sl.appendChild(el("div","heading",fmt(s.heading)));
    sl.appendChild(el("h1","",fmt(s.title)));
    if (s.example) sl.appendChild(el("div","example",fmt(s.example)));
    if (s.layout==="bca"){
      const g=el("div","bca"); const BL=s.boxLabels||["BEFORE","CHANGE","AFTER"];
      [[BL[0],s.before,""],[BL[1],s.change,""],[BL[2],s.after,"after"]].forEach(([h,t,c],i)=>{
        if(i) g.appendChild(el("div","arr"));
        const b=el("div","box "+c); b.appendChild(el("h2","",h)); b.appendChild(el("p","",fmt(t))); g.appendChild(b); });
      sl.appendChild(g);
    }
    if (s.layout==="table"){
      if (s.rows && s.rows.length){
        const t=el("table","ref"+(s.dense?" dense":""));
        if (s.colWidths){ const cg=el("colgroup"); s.colWidths.forEach(w=>{ const c=el("col"); c.style.width=w; cg.appendChild(c); }); t.appendChild(cg); }
        const tr=el("tr"); s.columns.forEach(c=>tr.appendChild(el("th","",esc(c)))); t.appendChild(tr);
        s.rows.forEach(r=>{ const row=el("tr"); r.forEach((c,ci)=>row.appendChild(el("td",(s.monoCols||[]).includes(ci)?"mono":"", s.verbatim?esc(c):fmt(c)))); t.appendChild(row); });
        if (s.tableSize) t.querySelectorAll("td").forEach(td=>{ td.style.fontSize=s.tableSize+"px"; td.style.padding="11px 14px"; });
        sl.appendChild(t);
        if (s.footnote) sl.appendChild(el("div","footnote",esc(s.footnote)));
      } else if (s.placeholder) sl.appendChild(el("div","placeholder",fmt(s.placeholder)));
      if (s.note) sl.appendChild(el("div","note",fmt(s.note)));
      if (s.notes){ const n=el("div","notes"); s.notes.forEach(x=>n.appendChild(el("div","",fmt(x)))); sl.appendChild(n); }
    }
    if (s.layout==="cols"){ const g=el("div","cols"); s.columns2.forEach(c=>{ const d=el("div","col "+c.kind); d.appendChild(el("h2","",esc(c.head)));
      const ul=el("ul"); c.items.forEach(x=>ul.appendChild(el("li","",fmt(x)))); d.appendChild(ul); g.appendChild(d); }); sl.appendChild(g); }
    if (s.proof){ const g=el("div","proofgrid"); g.appendChild(bulletList(s.proof,""));
      if (s.refs){ const r=el("div","refs"); r.appendChild(el("div","rl",esc(s.refs.label)));
        (s.refs.tests||[]).forEach(([loc,name])=>r.appendChild(el("div","t",`<span>${esc(loc)}</span>${esc(name).replace(/_/g,"_<wbr>")}`)));
        if (s.refs.files) r.appendChild(el("div","f",s.refs.files.map(esc).join("<br>")));
        if (s.refs.note) r.appendChild(el("div","n",esc(s.refs.note)));
        g.appendChild(r); }
      sl.appendChild(g); }
    if (s.answer){ const a=el("div","answer"); s.answer.forEach(p=>a.appendChild(el("p","",fmt(p)))); sl.appendChild(a); }
    if (s.layout!=="table" && s.lines){ const ul=bulletList(s.lines, s.accent?"accent-"+s.accent:"" );
      if (s.size){ ul.querySelectorAll(":scope > li").forEach(li=>{ li.style.fontSize=s.size+"px"; li.style.marginBottom=Math.round(s.size*0.5)+"px"; });
        ul.querySelectorAll(".subl").forEach(x=>{ x.style.fontSize=Math.round(s.size*0.8)+"px"; }); }
      sl.appendChild(ul); }
    if (s.closing){ const ul=el("ul","lines"); s.closing.forEach(t=>ul.appendChild(el("li","sub",fmt(t)))); ul.style.marginTop="10px"; ul.querySelectorAll("li").forEach(li=>{li.style.fontSize="30px";li.style.marginBottom="14px";}); sl.appendChild(ul); }
    if (s.layout==="qa" && s.note) sl.appendChild(el("div","note",fmt(s.note)));
    if (s.miniFlow){ const m=el("div","miniflow"); m.appendChild(el("span","lbl",esc(s.miniFlow.label)));
      s.miniFlow.steps.forEach((x,i)=>{ if(i) m.appendChild(el("span","ar")); m.appendChild(el("span","st",esc(x))); }); sl.appendChild(m); }
    if (s.strip) sl.appendChild(el("div","strip",fmt(s.strip)));
    if (s.cue) sl.appendChild(el("div","cue",fmt(s.cue)));
    if (s.evidence){ const d=el("div","evid"); const href="file:///"+s.evidence.path.replace(/\\/g,"/").split("/").map(encodeURIComponent).join("/").replace(/^([A-Za-z])%3A/,"$1:");
      const a=el("a","",esc(s.evidence.label)); a.href=href; a.target="_blank"; a.rel="noopener"; d.appendChild(a);
      d.appendChild(el("span","path",esc(s.evidence.display||s.evidence.path).replace(/\\/g,"\\<wbr>"))); sl.appendChild(d); }
    if (s.files){ const f=filesRow(s.files); f.style.marginTop=s.strip?"12px":"26px"; sl.appendChild(f); }
  }
  if (s.footer) sl.appendChild(el("div","footer",fmt(s.footer)));
  $("#count").textContent=`${si+1} / ${S.length}`;
  $("#bPrev").disabled = si===0 && step===0;
  $("#bNext").disabled = si===S.length-1 && step===stepCount(s)-1;
}
function next(){ if(step<stepCount(S[si])-1){ step++; render(); } else if(si<S.length-1){ si++; step=0; render(); } }
function prev(){ if(step>0){ step--; render(); } else if(si>0){ si--; step=stepCount(S[si])-1; render(); } }
$("#bNext").onclick=next; $("#bPrev").onclick=prev;

/* hidden timer (key S): counts elapsed time against the planned seconds of the current slide */
const starts=[]; S.reduce((a,s)=>{ starts.push(a); return a+(s.seconds||0); },0);
let running=false, base=0, t0=0;
const elapsed=()=>base+(running?(performance.now()-t0)/1000:0);
const mmss=t=>{ const n=Math.max(0,Math.round(t)); return Math.floor(n/60)+":"+String(n%60).padStart(2,"0"); };
function tick(){
  const tm=$("#timer");
  if (tm.classList.contains("on")){ const t=elapsed(), s=S[si], end=starts[si]+(s.seconds||0);
    tm.textContent=`${mmss(t)}${s.seconds?` · slide ends ${mmss(end)}`:""}${running?"":" · paused"}`;
    tm.classList.toggle("over", !!s.seconds && t>end); tm.classList.toggle("warn", !!s.seconds && t<=end && end-t<=10); }
  requestAnimationFrame(tick);
}
function toggleTimer(){ const tm=$("#timer"); if(!tm.classList.contains("on")){ tm.classList.add("on"); if(!running){ t0=performance.now(); running=true; } } else { if(running){ base=elapsed(); running=false; } tm.classList.remove("on"); } }

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ si=0; step=0; render(); }
  else if(e.key==="End"){ si=S.length-1; step=0; render(); }
  else if(k==="s") toggleTimer();
  else if(k==="t"){ const r=document.documentElement; r.dataset.theme=r.dataset.theme==="light"?"dark":"light"; store.set("hd-theme",r.dataset.theme); }
  else if(k==="f"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
});
const th=store.get("hd-theme"); if(th) document.documentElement.dataset.theme=th;
render(); requestAnimationFrame(tick);
});
</script>
